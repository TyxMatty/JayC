# Jay-C server (signaling + media SFU)
#
# Users: put this file in an empty folder and run `docker compose up -d`.
# Developers (inside the repo): `docker compose up -d --build` builds from source.
#
# Open these ports in your firewall: 3000/tcp (signaling) and 40000/udp + 40000/tcp (media).
name: jay-c

services:
  signaling:
    image: ghcr.io/tyxmatty/jay-c-signaling:latest
    build:
      context: ..
      dockerfile: signaling-server/Dockerfile
    container_name: jay-c-signaling
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "40000:40000/udp"
      - "40000:40000/tcp"
    environment:
      PORT: 3000
      RTC_PORT: 40000
      MAX_PEERS_PER_ROOM: 16
      # Media goes to the address each client used to reach this server (e.g. 192.168.1.50).
      # Set this only if that doesn't work for you, e.g. behind a reverse proxy:
      # ANNOUNCED_ADDRESS: "192.168.1.50"
      # Restrict which apps may connect (Windows/Android use http://tauri.localhost,
      # macOS/iOS/Linux use tauri://localhost). Empty = accept any origin.
      # ALLOWED_ORIGINS: "http://tauri.localhost,tauri://localhost"
      # STUN/TURN servers handed to clients on join (only needed outside LAN/VPN).
      # ICE_SERVERS: '[{"urls":"stun:stun.l.google.com:19302"}]'
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
