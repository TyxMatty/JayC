[package]
name = "jay-c"
version = "0.2.6"
description = "Jay-C — lightweight calls and screen sharing"
authors = ["TyxMatty"]
license = "MIT"
repository = "https://github.com/TyxMatty/JayC"
edition = "2024"
rust-version = "1.90"

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows (cargo#8519).
name = "jay_c_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-system-audio = { path = "../../plugins/tauri-plugin-system-audio" }
tauri-plugin-pip = { path = "../../plugins/tauri-plugin-pip" }

[target.'cfg(windows)'.dependencies]
# Same versions as wry's, to reach the WebView2 controller it creates.
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
# Smaller, leaner binaries.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
