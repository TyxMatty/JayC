<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="system-ui, 'Segoe UI', sans-serif">
  <rect width="720" height="300" rx="16" fill="#171a23"/>
  <!-- Links from the server to each viewer -->
  <g stroke="#818cf8" stroke-width="3" stroke-dasharray="2 7" stroke-linecap="round">
    <path d="M300 150 L140 70"/>
    <path d="M300 150 L120 230"/>
    <path d="M420 150 L580 70"/>
    <path d="M420 150 L600 230"/>
  </g>
  <!-- Server -->
  <rect x="290" y="96" width="140" height="108" rx="12" fill="#1f2330" stroke="#818cf8" stroke-width="2"/>
  <text x="360" y="130" font-size="13" fill="#9aa1b2" text-anchor="middle">Server PC</text>
  <text x="360" y="158" font-size="17" font-weight="700" fill="#e6e8ef" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">192.168.1.50</text>
  <text x="360" y="182" font-size="13" fill="#9aa1b2" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">:3000</text>
  <!-- Viewers -->
  <g fill="#1f2330" stroke="#3a4152" stroke-width="2">
    <rect x="70" y="44" width="96" height="58" rx="6"/>
    <rect x="50" y="202" width="96" height="58" rx="6"/>
    <rect x="554" y="44" width="96" height="58" rx="6"/>
    <rect x="574" y="202" width="96" height="58" rx="6"/>
  </g>
  <g font-size="12" fill="#9aa1b2" text-anchor="middle">
    <text x="118" y="78">Friend</text>
    <text x="98" y="236">Friend</text>
    <text x="602" y="78">Friend</text>
    <text x="622" y="236">Friend</text>
  </g>
  <!-- Upload note -->
  <rect x="236" y="236" width="248" height="40" rx="20" fill="#2a2f3d"/>
  <text x="360" y="261" font-size="13" fill="#e6e8ef" text-anchor="middle">one copy per viewer → upload adds up</text>
</svg>
