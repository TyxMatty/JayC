<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="system-ui, 'Segoe UI', sans-serif">
  <rect width="720" height="300" rx="16" fill="#171a23"/>
  <!-- PC -->
  <rect x="200" y="40" width="320" height="190" rx="12" fill="#1f2330" stroke="#3a4152" stroke-width="2"/>
  <rect x="216" y="56" width="288" height="158" rx="6" fill="#11141b"/>
  <path d="M330 230 h60 l10 28 h-80 z" fill="#2a2f3d"/>
  <rect x="300" y="256" width="120" height="8" rx="4" fill="#2a2f3d"/>
  <!-- Docker area with the container -->
  <text x="232" y="80" font-size="13" fill="#9aa1b2">Docker Desktop</text>
  <rect x="232" y="92" width="256" height="104" rx="8" fill="none" stroke="#3a4152" stroke-dasharray="6 5" stroke-width="1.5"/>
  <g transform="translate(272 108)">
    <path d="M88 0 l88 22 v50 l-88 22 l-88 -22 v-50 z" fill="#4f46e5" opacity="0.25"/>
    <path d="M88 0 l88 22 l-88 22 l-88 -22 z" fill="#818cf8"/>
    <path d="M0 22 l88 22 v50 l-88 -22 z" fill="#6366f1"/>
    <path d="M176 22 l-88 22 v50 l88 -22 z" fill="#4f46e5"/>
  </g>
  <!-- Labels -->
  <text x="40" y="128" font-size="15" font-weight="600" fill="#e6e8ef">Your PC</text>
  <text x="40" y="150" font-size="13" fill="#9aa1b2">runs the server</text>
  <path d="M150 140 h40" stroke="#5b6275" stroke-width="2" marker-end="url(#a)"/>
  <text x="552" y="128" font-size="15" font-weight="600" fill="#e6e8ef">Jay-C server</text>
  <text x="552" y="150" font-size="13" fill="#9aa1b2">in a container,</text>
  <text x="552" y="168" font-size="13" fill="#9aa1b2">nothing else to install</text>
  <path d="M544 145 h-50" stroke="#5b6275" stroke-width="2" marker-end="url(#a)"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6275"/>
    </marker>
  </defs>
</svg>
