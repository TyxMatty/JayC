<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="system-ui, 'Segoe UI', sans-serif">
  <rect width="720" height="300" rx="16" fill="#171a23"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#818cf8"/>
    </marker>
  </defs>
  <!-- Friends -->
  <text x="40" y="70" font-size="15" font-weight="600" fill="#e6e8ef">Friends</text>
  <g fill="#1f2330" stroke="#3a4152" stroke-width="2">
    <rect x="40" y="90" width="90" height="56" rx="6"/>
    <rect x="40" y="170" width="90" height="56" rx="6"/>
  </g>
  <!-- Wall with two openings -->
  <rect x="330" y="40" width="40" height="220" rx="6" fill="#2a2f3d"/>
  <rect x="326" y="92" width="48" height="40" rx="6" fill="#171a23" stroke="#4ade80" stroke-width="2"/>
  <rect x="326" y="168" width="48" height="40" rx="6" fill="#171a23" stroke="#4ade80" stroke-width="2"/>
  <text x="350" y="270" font-size="13" fill="#9aa1b2" text-anchor="middle">Firewall</text>
  <!-- Arrows through the openings -->
  <path d="M136 118 H560" stroke="#818cf8" stroke-width="3" marker-end="url(#a)"/>
  <path d="M136 198 H560" stroke="#818cf8" stroke-width="3" marker-end="url(#a)"/>
  <text x="160" y="106" font-size="14" font-weight="600" fill="#e6e8ef">3000 TCP</text>
  <text x="250" y="106" font-size="13" fill="#9aa1b2">signaling</text>
  <text x="160" y="186" font-size="14" font-weight="600" fill="#e6e8ef">40000 UDP + TCP</text>
  <text x="160" y="222" font-size="13" fill="#9aa1b2">audio and video</text>
  <!-- Server -->
  <rect x="572" y="80" width="108" height="150" rx="10" fill="#1f2330" stroke="#818cf8" stroke-width="2"/>
  <path d="M592 110 h68 M592 130 h68 M592 150 h68" stroke="#3a4152" stroke-width="6" stroke-linecap="round"/>
  <circle cx="660" cy="200" r="6" fill="#4ade80"/>
  <text x="626" y="256" font-size="14" font-weight="600" fill="#e6e8ef" text-anchor="middle">Server PC</text>
</svg>
