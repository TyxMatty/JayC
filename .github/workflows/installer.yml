# The Windows installer (NSIS), built on a clean machine: on a version tag (v*) or by hand from the
# Actions tab. It is kept as the run's artifact, and on a tag it goes into a draft GitHub release.
# Publishing stays a manual step (notes, checking the installer on a test PC): Jay-C's auto-update
# and the Jay-H hub only see published releases.
name: Installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows installer (NSIS)
    runs-on: windows-latest
    permissions:
      contents: write # the draft release
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}\target
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # The system-audio plugin's build.rs compiles WebRTC's audio processing with Meson + Ninja.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install meson ninja
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> ../../target
      - run: npm ci
      # tauri build: vite build, cargo build --release, then the NSIS installer
      # (frontend/src-tauri/windows/installer.nsi, the project's own template).
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: Jay-C-installer-${{ github.ref_name }}
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
      # On a tag: a draft release with the installer. A published release is never touched: its
      # installer's SHA-256 is what Jay-C's auto-update and Jay-H check downloads against.
      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          files=(target/release/bundle/nsis/*.exe)
          draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          case "$draft" in
            none) gh release create "$tag" "${files[@]}" --draft --verify-tag --title "Jay-C ${tag#v}" --notes "Draft made by the Installer workflow: write the notes, check the installer, then publish." ;;
            true) gh release upload "$tag" "${files[@]}" --clobber ;;
            *) echo "The $tag release is already published: its installer stays as it is." ;;
          esac
