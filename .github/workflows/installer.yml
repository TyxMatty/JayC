# The Windows installer (NSIS), built on a clean machine: on a version tag (v*) or by hand from the
# Actions tab. It is kept as the run's artifact; publishing the release stays a manual step (notes,
# checking the installer on a test PC).
name: Installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows installer (NSIS)
    runs-on: windows-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}\target
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # The system-audio plugin's build.rs compiles WebRTC's audio processing with Meson + Ninja.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install meson ninja
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> ../../target
      - run: npm ci
      # tauri build: vite build, cargo build --release, then the NSIS installer
      # (frontend/src-tauri/windows/installer.nsi, the project's own template).
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: Jay-C-installer-${{ github.ref_name }}
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
