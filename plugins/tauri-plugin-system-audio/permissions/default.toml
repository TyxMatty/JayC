[default]
description = "Lets the app capture audio natively: other apps' sound for screen sharing, and the call microphone."
permissions = [
  "allow-is-supported",
  "allow-list-audio-apps",
  "allow-window-process",
  "allow-start-capture",
  "allow-stop-capture",
  "allow-start-mic",
  "allow-stop-mic",
]
