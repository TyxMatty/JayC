[package]
name = "tauri-plugin-system-audio"
version = "0.1.0"
description = "Per-process audio capture for Jay-C screen sharing (Windows: WASAPI process loopback)"
authors = ["TyxMatty"]
license = "MIT"
edition = "2024"
rust-version = "1.90"
links = "tauri-plugin-system-audio"

[dependencies]
tauri = { version = "2.12" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"

[target.'cfg(windows)'.dependencies]
wasapi = "0.26"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
# link::fake, a stand-in Jay-A for the fake_jay_a example (tests always have it).
fake-jay-a = []

[[example]]
name = "fake_jay_a"
required-features = ["fake-jay-a"]

[build-dependencies]
tauri-plugin = { version = "2.7", features = ["build"] }
cc = "1"
